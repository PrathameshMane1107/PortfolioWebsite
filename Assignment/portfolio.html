<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <!-- no need but then also if home button  doesnt work -->
            <!-- <a class="navbar-brand" href="index.html">My Portfolio</a> -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="portfolio.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Portfolio Section -->
    <section class="container mt-5 pt-5">
        <pre>
            
            
            <h2 class="text-center mb-4">My Portfolio</h2>
        </pre>
        <!-- Filter Buttons -->
        <div class="text-center mb-4">
            <button class="btn btn-primary filter-btn" data-filter="all">All</button>
            <button class="btn btn-secondary filter-btn" data-filter="web-design">Web Design</button>
            <button class="btn btn-secondary filter-btn" data-filter="photography">Photography</button>
            <button class="btn btn-secondary filter-btn" data-filter="illustrations">Illustrations</button>
        </div>

        <!-- Portfolio Gallery -->
        <div class="row" id="portfolio-gallery">
            <div class="col-md-4 portfolio-item web-design">
                <div class="card">
                    <img src="web1.jpg" class="card-img-top lightbox-trigger" alt="Web Design 1">
                    <div class="card-body">
                        <h5 class="card-title">Web Design Project</h5>
                        <p class="card-text">A modern website design concept.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 portfolio-item photography">
                <div class="card">
                    <img src="photo1.jpg" class="card-img-top lightbox-trigger" alt="Photography 1">
                    <div class="card-body">
                        <h5 class="card-title">Photography Work</h5>
                        <p class="card-text">A creative photography project.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 portfolio-item illustrations">
                <div class="card">
                    <img src="art.jpg" class="card-img-top lightbox-trigger" alt="Illustration 1">
                    <div class="card-body">
                        <h5 class="card-title">Illustration Art</h5>
                        <p class="card-text">A beautiful hand-drawn illustration.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>My Portfolio</p>
        <a href="https://www.linkedin.com/public-profile/settings?trk=d_flagship3_profile_self_view_public_profile" target="_main"><img src="https://logospng.org/download/linkedin/logo-linkedin-icon-4096.png" alt="LinkedIn" width="50"> </a>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
